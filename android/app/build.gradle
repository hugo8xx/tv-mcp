plugins { id 'com.android.application' }
android {
    namespace 'com.pinato.remote'
    compileSdk 34
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.pinato.remote'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
        buildConfigField 'String', 'DEFAULT_SERVER', "\"${project.findProperty('tvRemoteServer') ?: ''}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
}
